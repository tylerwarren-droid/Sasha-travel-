# CR 76 · THE ONE YES RULE — the shared conformance set, on every push. The same conformance.json runs in AgAPI (here), Sasha's S2 and AD.
name: yes-one

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # the module is GENERATED: regenerating from the committed AgAPI 1.3 contract snapshot must change nothing
      - run: python3 tools/yes_one/generate.py --contract tools/yes_one/contract && git diff --exit-code tools/yes_one/dist
      - name: conformance — yes_one.py
        run: cd tools/yes_one/dist && python3 -m unittest test_yes_one -v
      - name: conformance — yes_one.ts
        run: node --experimental-strip-types tools/yes_one/dist/yes_one.test.ts
      - name: AgAPI's vendored copy is the generated module, byte for byte
        run: |
          for f in yes_one.py conformance.json test_yes_one.py; do cmp tools/yes_one/dist/$f agapi_service/yes_one/$f; done
          python3 -m unittest agapi_service.yes_one.test_yes_one
