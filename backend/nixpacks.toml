[phases.setup]
nixPkgs = ["python3", "python3Packages.pip", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxkbcommon", "mesa", "libGL"]

[phases.install]
cmds = ["python3 -m pip install -r requirements.txt", "playwright install chromium"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
